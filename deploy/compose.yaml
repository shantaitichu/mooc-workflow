services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: mooc
      POSTGRES_USER: mooc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mooc"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://mooc:${POSTGRES_PASSWORD}@postgres:5432/mooc
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - media-data:/app/.data
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
  media-data:
